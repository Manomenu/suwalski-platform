  suwageval.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1e1e2e"/><rect x="21" y="8" width="22" height="6" rx="2.5" fill="#cba6f7"/><path d="M26 13h12v13l12.6 21.4c1.9 3.3-.3 6.6-4 6.6H17.4c-3.7 0-5.9-3.3-4-6.6L26 26z" fill="#cba6f7" stroke="#cba6f7" stroke-width="2" stroke-linejoin="round"/><path d="M20 41h24l4.4 7.4c.8 1.4-.1 2.6-1.6 2.6H17.2c-1.5 0-2.4-1.2-1.6-2.6z" fill="#a6e3a1"/></svg>
