# The SVGs are copied byte for byte, each on one line.
# yamllint disable rule:line-length
# Icons of the start page's tiles, served by Homepage itself at /icons/<file> (deployment.yaml mounts
# this ConfigMap at /app/public/icons): a tile keeps its icon while the app is down or switched off.
# Copies of the apps' own favicons — when an app changes its favicon, copy it here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-icons
data:
