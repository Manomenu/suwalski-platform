# cloudflared: opens outbound connections to Cloudflare and hands the traffic arriving through
# them to Traefik. The routes (which host goes where) are NOT here — Cloudflare holds them,
# terraform/edge/tunnel.tf describes them. This pod knows only the token it identifies itself with.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  # Two replicas are not high availability — there is a single node. This is about updates:
  # during a version change one replica holds the tunnel while the other starts, so auntie
  # sees no interruption. Each replica is a separate "connector" of the same tunnel.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true # the image runs as nonroot (65532) anyway
      containers:
        - name: cloudflared
          # Pinned version, like everything in this repo. Newer one: change it here, commit, push.
          image: cloudflare/cloudflared:2026.9.3
          args:
            - tunnel
            # The image is updated by changing this file, not by itself at runtime.
            - --no-autoupdate
            # /ready endpoint for the probe below. 0.0.0.0, because the kubelet knocks from outside the container.
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # `cloudflared tunnel run` reads the token from this variable — so it does not end up
            # in the process arguments, visible in `ps` and in the pod description.
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          # /ready returns 200 only when there is at least one connection to Cloudflare.
          # A pod without a connection is a pod doing nothing — a restart is the right reaction.
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
