# Gatus — the status checks and their Discord alerts. Config in config.yaml (a ConfigMap Gatus
# re-reads on change), no database: history lives in memory and starts over after a restart,
# which is enough for "is it up, and tell me when it is not".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  labels:
    app: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.37.0
          ports:
            - containerPort: 8080
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
          envFrom:
            # DISCORD_<CHANNEL>, one per Discord channel (config.yaml). Optional: without it
            # Gatus still checks and shows the status page, only the alerts go nowhere.
            - secretRef:
                name: gatus-discord
                optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: gatus-config
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
spec:
  selector:
    app: gatus
  ports:
    - port: 80
      targetPort: 8080
---
# The status page, inside the home network only: *.k8s.suwalski.internal → the node, like Argo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatus
spec:
  ingressClassName: traefik
  rules:
    - host: gatus.k8s.suwalski.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatus
                port:
                  number: 80
