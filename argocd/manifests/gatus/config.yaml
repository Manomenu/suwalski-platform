# Gatus: checks every minute or two whether things answer, and tells Discord when they stop
# (and when they come back). The list below IS the monitoring — a change here is a git commit.
#
# Per-environment switch: an endpoint with `alerts:` notifies Discord, one without it is only
# shown on the status page (http://gatus.k8s.suwalski.internal). Deployment results (sync
# failed, Degraded, deployed) come from Argo CD Notifications instead — annotations on the
# environment's Application, terraform/platform/notifications.tf.
#
# Channels: platform checks go to #suw-platf-notif (the default below); a project's checks name
# their own channel with `provider-override`. The webhook URLs are variables from the
# gatus-discord Secret, one per channel, set by the setup.sh that owns the channel
# (scripts/.internal/lib.sh, discord_channel) — never in git.
#
# Do NOT route by `overrides:` per group: Gatus rejects the whole Discord provider — every
# alert, silently — when one group's URL is empty, i.e. when one project has not run its
# setup.sh yet. An empty `provider-override` is skipped instead: the alert falls back to
# #suw-platf-notif. (Tested against v5.37.0.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |
    # yamllint disable rule:line-length
    alerting:
      discord:
        webhook-url: "${DISCORD_SUW_PLATF_NOTIF}"
        title: ":rotating_light: suwalski-platform"
        default-alert:
          # Three failed checks in a row before the first message — one slow answer is not
          # an outage — and two good ones before "resolved".
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    ui:
      title: "suwalski-platform — status"
      header: "suwalski-platform"

    endpoints:
      # ── platform ───────────────────────────────────────────────────────────────
      - name: tunel Cloudflare
        group: platforma
        # A public app behind the tunnel: if this answers, Cloudflare → tunnel → cloudflared →
        # Traefik works for every app. (Apps behind Access cannot be checked from outside
        # without logging in — their own checks below go through the cluster.)
        url: "https://grzyby.gugnowski.com/healthz"
        interval: 2m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord

      - name: PostgreSQL (shared)
        group: platforma
        url: "tcp://shared-rw.postgres.svc.cluster.local:5432"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord

      # ── automat-operat-dev ─────────────────────────────────────────────────────
      - name: automat-operat-dev — strona
        group: automat-operat-dev
        url: "http://automat-operat-dev-web.automat-operat-dev.svc.cluster.local/healthz"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
            provider-override:
              webhook-url: "${DISCORD_APP_AUTOMAT_OPERAT_DEV_NOTIF}"

      - name: automat-operat-dev — serwer i baza
        group: automat-operat-dev
        # Through nginx like the browser; the server answers only once its database is up.
        url: "http://automat-operat-dev-web.automat-operat-dev.svc.cluster.local/api/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == ok"
        alerts:
          - type: discord
            provider-override:
              webhook-url: "${DISCORD_APP_AUTOMAT_OPERAT_DEV_NOTIF}"

      # ── grzyby ──────────────────────────────────────────────────────────────────
      - name: grzyby — serwer
        group: grzyby
        url: "http://grzyby-web.grzyby.svc.cluster.local/api/health"
        interval: 2m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
            provider-override:
              webhook-url: "${DISCORD_APP_GRZYBY_NOTIF}"
