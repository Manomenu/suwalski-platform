# automat-operat / dev — automat-operat (automating property valuation reports) for auntie.
#
# Path from the internet: automat-operat-dev.gugnowski.com → Cloudflare Access (group "automat-operat-dev")
# → tunnel → cloudflared → Traefik → Ingress in THIS namespace → nginx (web) → /api → server.
#
# The code repo is private. Argo reads it with a deploy key (the Secret is created by
# scripts/projects/automat-operat/setup.sh — the project-level one), and k3s pulls images from GHCR
# with the project token, which dev/setup.sh puts into this namespace as the ghcr-pull Secret.
# Without them Argo shows "repository not found" and the pods ImagePullBackOff.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automat-operat-dev
  namespace: argocd
  # Deleting the Application (file disappears from git → root prunes it) also deletes everything
  # it deployed. Without this the resources stay orphaned in the cluster — see AGENTS.md, Zasady.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # SSH, not https: the repo-automat-operat Secret matches the Application by URL, character for character.
    repoURL: git@github.com:Manomenu/automat-operat.git
    targetRevision: master
    path: deploy/chart
    helm:
      parameters:
        # ↓ THIS ONE LINE IS THE DEPLOYMENT.
        - name: image.tag
          value: sha-9c587dd
        # docker-registry Secret from setup.sh — images of a private repo are private.
        - name: image.pullSecret
          value: ghcr-pull
        # Both made by scripts/projects/automat-operat/dev/setup.sh: DATABASE_URL to the shared
        # PostgreSQL, and what the server needs to verify the Cloudflare Access login.
        - name: server.databaseSecret
          value: database
        - name: server.accessConfigMap
          value: cloudflare-access
        # Host from terraform/edge/edge.auto.tfvars (apps.automat-operat-dev). Must match
        # character for character — otherwise Traefik answers 404 even though login and the tunnel work.
        - name: ingress.host
          value: automat-operat-dev.gugnowski.com

  destination:
    server: https://kubernetes.default.svc
    namespace: automat-operat-dev

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
