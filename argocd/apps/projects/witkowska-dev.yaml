# witkowska / dev — ⚠ TYMCZASOWO: zamiast aplikacji cioci biegnie tu suwalski-investing-tools.
#
# Po co: sprawdzić całą drogę z internetu przed napisaniem prawdziwej apki —
# witkowska-dev.gugnowski.com → Cloudflare Access (grupa „admin”) → tunel → cloudflared
# → Traefik → Ingress w TEJ przestrzeni nazw. Gdy apka cioci powstanie, podmień `source`
# na jej repo i chart; nazwa Application, przestrzeń nazw i host zostają.
#
# Ten sam chart co w suwalski-investing-tools.yaml, drugie wydanie obok: chart nazywa obiekty
# od nazwy wydania (= nazwy Application), więc nic nie koliduje z instancją w suw-inv-tools.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: witkowska-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Manomenu/suwalski-investing-tools.git
    targetRevision: master
    path: deploy/chart
    helm:
      parameters:
        - name: image.tag
          value: sha-1c52a77
        # Host z terraform/edge/edge.auto.tfvars (apps.witkowska-dev). Musi się zgadzać
        # co do znaku — inaczej Traefik odpowie 404, choć logowanie i tunel działają.
        - name: ingress.host
          value: witkowska-dev.gugnowski.com
        # Secretu suwalski-sec tu nie ma, a chart ma go jako opcjonalny: apka wstaje,
        # tylko funkcje korzystające z SEC EDGAR nie zadziałają. Na test wystarczy.

  destination:
    server: https://kubernetes.default.svc
    namespace: witkowska-dev

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
