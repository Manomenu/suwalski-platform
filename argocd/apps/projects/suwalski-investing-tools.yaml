# What should run in the cluster. Argo watches this directory and applies changes on its own.
#
# Split of responsibilities, agreed in the roadmap:
#   code repo  — publishes images and describes the SHAPE of the deployment (chart)
#   this repo  — decides WHICH VERSION runs
#
# That is why `targetRevision` is one exact commit of the code repo and `image.tag` below the image
# built from that same commit: one bump moves the chart and the image together, and a commit to the
# chart alone deploys nothing. The git history of this file IS the deployment history.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: suwalski-investing-tools
  namespace: argocd
  # Deleting the Application also deletes everything it deployed — see AGENTS.md, Zasady.
  # The cache PVC has Delete=false and survives that on purpose.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Manomenu/suwalski-investing-tools.git
    # ↓ THE DEPLOYMENT IS TWO VALUES, CHANGED TOGETHER: this commit (the chart) and image.tag below
    # (its image, sha-<first 7 characters of the commit>). `just argo deploy <app>` moves both.
    targetRevision: ac8b37b2ea682543a6b6b4d57b6612a568842831
    path: deploy/chart
    helm:
      parameters:
        # Image of the commit in targetRevision — the other half of the deployment.
        - name: image.tag
          value: sha-ac8b37b
        # DATABASE_URL in the shared Postgres (role and database suwinvtools) —
        # scripts/projects/suwalski-investing-tools/setup.sh creates it.
        - name: server.databaseSecret
          value: database
        # Webhooks of the signals' Discord channels and the model the monthly job asks —
        # the same setup.sh creates it. Private infrastructure, so a Secret, not a parameter.
        - name: signals.secret
          value: signals

  destination:
    server: https://kubernetes.default.svc
    # The project's own namespace, like every project. No -dev/-prod suffix, because the project
    # has a single environment; abbreviated, because the full name would repeat in every kubectl -n.
    namespace: suw-inv-tools

  syncPolicy:
    automated:
      # Reconcile when git changes. Without this Argo would only show "OutOfSync"
      # and wait for a click.
      selfHeal: true
      # Delete objects that disappeared from git — otherwise something removed from the chart
      # would stay in the cluster forever. The PVC is excluded from this by an annotation.
      prune: true
    syncOptions:
      # Argo creates the namespace. The suwalski-sec Secret is put into it by
      # scripts/projects/suwalski-investing-tools/setup.sh — which also creates it if needed.
      - CreateNamespace=true
