# Co ma biec w klastrze. Argo obserwuje ten katalog i wprowadza zmiany samo.
#
# Podział odpowiedzialności, ustalony w roadmapie:
#   repo z kodem  — publikuje obrazy i opisuje KSZTAŁT wdrożenia (chart)
#   to repo       — decyduje, KTÓRA WERSJA biegnie
#
# Dlatego `targetRevision` wskazuje gałąź charta, a `image.tag` niżej jest przypięty
# do konkretnego obrazu. Historia tego pliku w gicie JEST historią wdrożeń.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: suwalski-investing-tools
  namespace: argocd
  # Usunięcie Application kasuje też wszystko, co wdrożyła — patrz AGENTS.md, Zasady.
  # PVC z cache ma Delete=false i przeżywa to celowo.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Manomenu/suwalski-investing-tools.git
    targetRevision: master
    path: deploy/chart
    helm:
      parameters:
        # ↓ TA JEDNA LINIJKA JEST WDROŻENIEM.
        # W Fazie 6 podbije ją CI commitem; dziś zmieniasz ją ręcznie.
        - name: image.tag
          value: sha-1c52a77

  destination:
    server: https://kubernetes.default.svc
    # Własna przestrzeń nazw projektu, jak każdy projekt. Bez sufiksu -dev/-prod, bo projekt
    # ma jedno środowisko; skrót, bo pełna nazwa powtarzałaby się w każdym kubectl -n.
    namespace: suw-inv-tools

  syncPolicy:
    automated:
      # Wyrównuj, gdy git się zmieni. Bez tego Argo tylko pokazywałoby „OutOfSync"
      # i czekało na kliknięcie.
      selfHeal: true
      # Kasuj obiekty, które zniknęły z gita — inaczej po usunięciu czegoś z charta
      # zostawałoby ono w klastrze na zawsze. PVC jest z tego wyłączony adnotacją.
      prune: true
    syncOptions:
      # Przestrzeń zakłada Argo. Secret suwalski-sec wkłada do niej
      # scripts/projects/suwalski-investing-tools/setup.sh — ten też ją tworzy, jeśli trzeba.
      - CreateNamespace=true
