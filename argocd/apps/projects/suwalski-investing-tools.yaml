# What should run in the cluster. Argo watches this directory and applies changes on its own.
#
# Split of responsibilities, agreed in the roadmap:
#   code repo  — publishes images and describes the SHAPE of the deployment (chart)
#   this repo  — decides WHICH VERSION runs
#
# That is why `targetRevision` points to the chart branch, and `image.tag` below is pinned
# to a specific image. The git history of this file IS the deployment history.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: suwalski-investing-tools
  namespace: argocd
  # Deleting the Application also deletes everything it deployed — see AGENTS.md, Zasady.
  # The cache PVC has Delete=false and survives that on purpose.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Manomenu/suwalski-investing-tools.git
    targetRevision: master
    path: deploy/chart
    helm:
      parameters:
        # ↓ THIS ONE LINE IS THE DEPLOYMENT.
        # In Phase 6 CI will bump it with a commit; today you change it by hand.
        - name: image.tag
          value: sha-737aec8

  destination:
    server: https://kubernetes.default.svc
    # The project's own namespace, like every project. No -dev/-prod suffix, because the project
    # has a single environment; abbreviated, because the full name would repeat in every kubectl -n.
    namespace: suw-inv-tools

  syncPolicy:
    automated:
      # Reconcile when git changes. Without this Argo would only show "OutOfSync"
      # and wait for a click.
      selfHeal: true
      # Delete objects that disappeared from git — otherwise something removed from the chart
      # would stay in the cluster forever. The PVC is excluded from this by an annotation.
      prune: true
    syncOptions:
      # Argo creates the namespace. The suwalski-sec Secret is put into it by
      # scripts/projects/suwalski-investing-tools/setup.sh — which also creates it if needed.
      - CreateNamespace=true
