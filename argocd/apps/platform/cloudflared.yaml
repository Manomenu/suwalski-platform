# cloudflared — the link between the cluster and the Cloudflare tunnel from terraform/edge/.
#
# Unlike suwalski-investing-tools, the manifests live in THIS repo
# (argocd/manifests/cloudflared/): this is not our code with its own release, but a piece
# of the platform, like Traefik. The image version is pinned in deployment.yaml.
#
# The tunnel token is NOT in git. The cloudflared-token Secret is created by scripts/setup.sh
# from the terraform/edge output. Until it exists the pods wait in CreateContainerConfigError —
# and that is fine, they come up on their own once the Secret appears.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  # Alerts (terraform/platform/notifications.tf): failures to #suw-platf-notif.
  # Remove a line to silence that event for this environment.
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.suw-platf-notif: ""
    notifications.argoproj.io/subscribe.on-health-degraded.suw-platf-notif: ""
spec:
  project: default

  source:
    repoURL: https://github.com/Manomenu/suwalski-platform.git
    targetRevision: master
    path: argocd/manifests/cloudflared

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      # Argo creates the namespace. setup.sh creates it too (so there is somewhere to put
      # the Secret before the first sync) — both ways are idempotent.
      - CreateNamespace=true
